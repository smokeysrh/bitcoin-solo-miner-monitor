name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run python -m pytest tests -q
      - name: llms.txt is up to date
        run: uv run python scripts/gen_llms_txt.py --check

  web:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node check-icons.mjs
      - run: npm run build:fast

  e2e:
    name: Browser tests (demo mode)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --extra dev --python 3.12
      - name: Build the UI into the package
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build:fast
      - name: Install required browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Start a simulated fleet (no hardware needed)
        run: |
          uv run bsmm serve --demo --port 8422 --host 127.0.0.1 > demo.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8422/api/v1/health && break || sleep 1; done
      - name: Browser tests
        working-directory: web
        env:
          BASE: http://127.0.0.1:8422
        run: npx playwright test --project=desktop --project=phone
      - name: Accessibility audit (axe)
        working-directory: web
        env:
          BASE: http://127.0.0.1:8422
          SIZES: desktop,phone
        run: node e2e/audit.mjs e2e/shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            web/test-results
            demo.log

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bsmm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and check it is healthy
        run: |
          docker run -d --name bsmm -p 8420:8420 bsmm:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bsmm)" = healthy ] && exit 0
            sleep 2
          done
          docker logs bsmm
          exit 1
